<style>/* Pricing ABBA Química — cores do Manual da Marca ABBA 2024
   Azul escuro #1F4781 (RGB 31,71,129) · Azul claro #0095DA (RGB 0,149,218) */
:root {
  --abba-navy: #1F4781;
  --abba-navy-900: #163460;
  --abba-navy-950: #102748;
  --abba-blue: #0095DA;
  --abba-blue-600: #0080BC;
  --abba-blue-50: #E6F4FB;
  --navy-50: #EDF1F8;

  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --border: #E1E6EE;
  --border-strong: #C9D2DF;
  --text: #1B2433;
  --text-2: #4A5568;
  --text-3: #718096;

  --ok: #17803D;
  --ok-bg: #E8F6EC;
  --warn: #9A5B00;
  --warn-bg: #FFF4E0;
  --danger: #B42318;
  --danger-bg: #FDECEA;
  --info-bg: var(--abba-blue-50);

  --radius: 10px;
  --radius-sm: 7px;
  --shadow: 0 1px 2px rgba(16, 39, 72, .06), 0 1px 3px rgba(16, 39, 72, .05);
  --shadow-lg: 0 10px 30px rgba(16, 39, 72, .18);
  --sidebar: 252px;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.45 var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--abba-navy); }
h1, h2, h3 { margin: 0; line-height: 1.25; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
[hidden] { display: none !important; }

.boot { display: grid; place-items: center; height: 100vh; }

/* ---------- Login ---------- */
.login-wrap { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.login-brand { background: linear-gradient(160deg, var(--abba-navy) 0%, var(--abba-navy-950) 100%); color: #fff; padding: 56px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.login-brand::after { content: ""; position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%; border: 70px solid rgba(0, 149, 218, .16); }
.login-brand img { width: 210px; }
.login-brand h1 { font-size: 30px; font-weight: 600; max-width: 420px; }
.login-brand p { color: #C9D6EA; max-width: 420px; }
.login-panel { display: grid; place-items: center; padding: 32px 16px; }
.login-card { width: 100%; max-width: 380px; }
.login-card h2 { font-size: 22px; margin-bottom: 6px; color: var(--abba-navy); }
.login-card .logo-mobile { display: none; width: 160px; margin-bottom: 28px; }
.login-card form { display: grid; gap: 14px; margin-top: 22px; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar { background: var(--abba-navy); color: #DCE5F2; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 30; }
.sidebar .brand { padding: 22px 22px 18px; border-bottom: 1px solid rgba(255, 255, 255, .1); }
.sidebar .brand img { width: 132px; display: block; }
.sidebar .brand span { display: block; margin-top: 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9FB4D3; }
.nav { padding: 14px 12px; display: grid; gap: 2px; }
.nav-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8EA5C8; padding: 14px 12px 6px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: #E4EBF5; text-decoration: none; font-weight: 500; position: relative; }
.nav a:hover { background: rgba(255, 255, 255, .07); }
.nav a.active { background: rgba(0, 149, 218, .22); color: #fff; }
.nav a.active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--abba-blue); }
.nav svg { width: 19px; height: 19px; flex: none; opacity: .9; }
.nav .badge { margin-left: auto; background: var(--abba-blue); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; font-weight: 600; }
.sidebar .foot { margin-top: auto; padding: 16px 22px; font-size: 12px; color: #8EA5C8; border-top: 1px solid rgba(255, 255, 255, .1); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 20; }
.topbar h1 { font-size: 20px; font-weight: 600; color: var(--abba-navy-950); }
.topbar .crumb { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.topbar .spacer { flex: 1; }
.menu-btn { display: none; }
.user-chip { display: flex; align-items: center; gap: 10px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--abba-blue-50); color: var(--abba-navy); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.user-chip .who { line-height: 1.2; }
.user-chip .who b { display: block; font-size: 13.5px; }
.user-chip .who span { font-size: 12px; color: var(--text-3); }

.viewas-bar { background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid #F3D9A8; padding: 9px 28px; display: flex; align-items: center; gap: 12px; font-weight: 500; }
.viewas-bar .btn { margin-left: auto; }
.viewas-bar > svg { width: 18px; height: 18px; flex: none; }

.content { padding: 24px 28px 40px; max-width: 1440px; width: 100%; }
.footer-note { padding: 12px 28px; font-size: 12px; color: var(--text-3); border-top: 1px solid var(--border); margin-top: auto; display: flex; gap: 8px; align-items: center; }

/* ---------- Componentes ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.card-h h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--abba-navy-950); font-weight: 700; }
.card-h .spacer { flex: 1; }
.card-b { padding: 18px 20px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--abba-navy); white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--abba-navy); border-color: var(--abba-navy); color: #fff; }
.btn-primary:hover { background: var(--abba-navy-900); }
.btn-accent { background: var(--abba-blue); border-color: var(--abba-blue); color: #fff; }
.btn-accent:hover { background: var(--abba-blue-600); }
.btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn-danger { background: var(--surface); border-color: #F1B4AE; color: var(--danger); }
.btn-danger:hover { background: var(--danger-bg); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn-block { width: 100%; }
.btn svg { width: 17px; height: 17px; }

.field { display: grid; gap: 6px; }
.field > label, .label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.input, .select, .textarea { width: 100%; height: 40px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 0 12px; background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; }
.textarea { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--abba-blue); box-shadow: 0 0 0 3px rgba(0, 149, 218, .18); }
.input.invalid { border-color: var(--danger); }
.hint { font-size: 12.5px; color: var(--text-3); }
/* Lista de clientes das propostas anteriores (simulador) */
.client-field { position: relative; }
.client-list { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; margin-top: 4px; background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); max-height: 280px; overflow-y: auto; }
.client-opt { display: grid; gap: 2px; width: 100%; text-align: left; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--border); background: none; cursor: pointer; font: inherit; }
.client-opt:last-child { border-bottom: 0; }
.client-opt:hover { background: var(--bg); }
.client-opt span { font-size: 12.5px; color: var(--text-2); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); width: 100%; }
.seg label { flex: 1; position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg span { display: block; text-align: center; padding: 9px 12px; font-weight: 600; color: var(--text-2); border-right: 1px solid var(--border); }
.seg label:last-child span { border-right: 0; }
.seg input:checked + span { background: var(--abba-navy); color: #fff; }
.seg input:focus-visible + span { box-shadow: inset 0 0 0 2px var(--abba-blue); }
.seg span small { display: block; font-weight: 500; font-size: 11.5px; opacity: .8; }
.seg span .seg-note { font-style: normal; font-weight: 500; font-size: 11px; opacity: .75; }

.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--abba-navy); flex: none; }

.alert { border-radius: var(--radius-sm); padding: 10px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.alert svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.alert-info { background: var(--info-bg); color: #0B4F74; }
.alert-ok { background: var(--ok-bg); color: var(--ok); }
.alert-warn { background: var(--warn-bg); color: var(--warn); }
.alert-danger { background: var(--danger-bg); color: var(--danger); }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip-padrao { background: var(--abba-blue-50); color: #0B5E8A; }
.chip-aguardando { background: var(--warn-bg); color: var(--warn); }
.chip-aprovada { background: var(--ok-bg); color: var(--ok); }
.chip-recusada { background: var(--danger-bg); color: var(--danger); }
.chip-neutral { background: #EEF1F5; color: var(--text-2); }
.chip-neutral::before, .chip-plain::before { display: none; }
.tag { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: #EEF1F5; color: var(--text-2); font-weight: 600; }
.tag-ipi { background: #F3EEFC; color: #5B3BA8; }
.tag-container { background: var(--navy-50); color: var(--abba-navy); }
.code { font-family: var(--mono); font-size: 12.5px; color: var(--abba-navy); font-weight: 600; }
.code-missing { font-size: 12px; color: var(--text-3); font-style: italic; }

/* Tabelas */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: #FAFBFD; }
.tbl .group td { background: var(--navy-50); font-weight: 700; color: var(--abba-navy-950); padding: 8px 14px; font-size: 13px; }
.tbl td.price { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; text-align: right; }
.tbl th.right { text-align: right; }
.tbl tr.clickable { cursor: pointer; }
.sob { color: var(--text-3); font-weight: 500; font-style: italic; }
/* Catálogo */
.tbl-cat td { vertical-align: middle; }
.tbl th.center, .tbl td.center { text-align: center; }
.tbl-cat thead tr.th-group th { font-size: 10.5px; letter-spacing: .08em; padding: 7px 14px 0; border-bottom: 0; color: var(--text-3); }
.tbl-cat thead tr.th-group th.sale { color: var(--abba-blue-600); }
.tbl-cat thead tr.th-group th.int { color: var(--abba-navy); }
.tbl-cat thead tr.th-group th.sale, .tbl-cat thead tr.th-group th.int { border-bottom: 2px solid currentColor; padding-bottom: 5px; }
.tbl-cat .int { background: #F6F8FC; }
.tbl-cat thead .int { background: #EDF1F8; }
.tbl-cat .int-first { border-left: 1px solid var(--border); }
.tbl-cat tbody tr:hover td.int { background: #EEF2F9; }
.tbl-cat td.sale { font-weight: 500; color: var(--text-2); }
.tbl-cat td.pack { white-space: nowrap; }
.tbl-cat td.sale.sale-main { font-weight: 700; color: var(--text); }
.tbl-cat .group td { font-size: 13.5px; letter-spacing: .01em; border-left: 3px solid var(--abba-blue); }
.tbl-cat .grp-n { margin-left: 10px; font-size: 11.5px; font-weight: 500; color: var(--text-3); }
.tbl-cat .dash { color: #B7C0CC; font-weight: 400; }
.tbl-cat .net { font-weight: 700; color: var(--abba-navy); }
/* Indicadores */
.ind-filters .input[type=date] { width: auto; }
.ikpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.ikpis-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.ikpis-3 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.ikpis-1 { grid-template-columns: 1fr; }
.ikpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; display: grid; gap: 2px; }
.ind-card .ikpi { background: var(--surface-2); }
.ikpi span { font-size: 12px; color: var(--text-3); font-weight: 600; }
.ikpi b { font-size: 22px; color: var(--abba-navy-950); font-variant-numeric: tabular-nums; }
.ikpi small { font-size: 12px; color: var(--text-3); }
.ikpi-warn { border-color: #F2C879; background: var(--warn-bg) !important; }
.ikpi-warn b { color: var(--warn); }
.ind-card { margin-bottom: 16px; }
.ind-lead { margin: 0 0 12px; }
.ind-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.ind-grid .ind-card { margin-bottom: 16px; }
.ind-tbl td { vertical-align: middle; font-size: 13px; }
.ind-tbl td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ind-tbl td small { display: block; font-size: 11.5px; }
.ind-barcell { min-width: 150px; }
.ind-flag { color: var(--warn); font-weight: 600; }
.ind-alert td:first-child { box-shadow: inset 3px 0 0 #E9A23B; }
.hbar { position: relative; height: 6px; margin-top: 5px; background: #EDF1F6; border-radius: 3px; }
.hbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--abba-blue); border-radius: 0 3px 3px 0; }
.hbar em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-2); }
.ind-reasons { display: grid; gap: 10px; }
.ind-reason { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; font-size: 13px; }
.ind-reason .hbar { grid-column: 1 / -1; }
@media (max-width: 900px) { .ind-grid { grid-template-columns: 1fr; } }
.ind-lead { font-size: 13px; color: var(--text-2); }
.vx-list { display: grid; gap: 14px; }
.vx-row { display: grid; gap: 5px; }
.vx-head { display: flex; align-items: baseline; gap: 10px; font-size: 13.5px; }
.vx-head b { color: var(--abba-navy-950); }
.vx-total { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--abba-navy-950); }
.vx-flag { font-size: 11.5px; font-weight: 700; color: var(--warn); background: var(--warn-bg); border: 1px solid #F2C879; padding: 1px 8px; border-radius: 999px; }
.vx-bar { display: flex; gap: 2px; height: 14px; background: #EEF2F6; border-radius: 4px; overflow: hidden; }
.vx-bar i { display: block; height: 100%; }
.vx-bar i:first-child { border-radius: 4px 0 0 4px; }
.vx-bar i:last-child { border-radius: 0 4px 4px 0; }
.vx-bar i[style*="width:0%"] { display: none; }
.vx-ok { background: #0095DA; }
.vx-disc { background: #E8833A; }
.vx-sub { font-size: 12.5px; color: var(--text-3); }
.vx-sub b { color: var(--text); }
.vx-legend { display: flex; gap: 18px; font-size: 12.5px; color: var(--text-2); margin: 4px 0 2px; }
.vx-legend span { display: inline-flex; align-items: center; gap: 6px; }
.vx-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
/* Indicadores no formato BI */
.bi-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
.bi-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; display: grid; gap: 2px; }
.bi-kpi span { font-size: 12.5px; color: var(--text-3); font-weight: 600; }
.bi-kpi b { font-size: 28px; font-weight: 700; color: var(--abba-navy-950); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.bi-kpi small { font-size: 12.5px; color: var(--text-3); }
.bi-kpi-warn { border-color: #F2C879; background: var(--warn-bg); }
.bi-kpi-disc { border-color: #F1B98A; background: #FFF4EB; box-shadow: inset 4px 0 0 #E8833A; }
.bi-kpi-disc b { color: #B9561A; }
.disc-txt { color: #B9561A; font-weight: 700; }
.bi-disc { border-top: 4px solid #E8833A; }
.bi-kpi-warn b { color: var(--warn); }
.bi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.bi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; display: grid; align-content: start; gap: 18px; min-width: 0; }
.bi-card header h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--abba-navy-950); }
.bi-card header p { margin: 2px 0 0; font-size: 13px; color: var(--text-3); }
.bi-internal { border-style: dashed; }
.bi-empty { color: var(--text-3); font-size: 13px; margin: 0; }
.bi-foot { font-size: 13px; color: var(--text-2); border-top: 1px solid var(--border); padding-top: 12px; }
/* colunas por mês */
.bi-cols { display: flex; align-items: flex-end; gap: 12px; height: 240px; }
.bi-col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }
.bi-col-v { font-size: 12.5px; font-weight: 700; color: var(--abba-navy-950); white-space: nowrap; }
.bi-col-bar { width: 100%; max-width: 110px; height: 170px; display: flex; flex-direction: column-reverse; justify-content: flex-start; gap: 2px; }
.bi-col-bar i { display: block; width: 100%; }
.bi-col-bar i.c-ok { border-radius: 6px 6px 0 0; }
.bi-col-bar i.c-disc { border-radius: 0; }
.bi-col-bar i[style*="height:0%"] { display: none; }
.c-ok { background: #0095DA; }
.c-disc { background: #E8833A; }
.bi-col-l { font-size: 12.5px; color: var(--text-3); }
.bi-col-p { font-size: 11.5px; color: var(--text-2); text-align: center; }
/* rosca */
.bi-donut { display: grid; grid-template-columns: 190px 1fr; align-items: center; gap: 24px; }
.bi-donut svg { width: 190px; height: 190px; }
.bi-donut .d-big { font-size: 7px; font-weight: 700; fill: var(--abba-navy-950); }
.bi-donut .d-sm { font-size: 2.6px; fill: var(--text-3); }
.bi-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.bi-legend li { display: grid; grid-template-columns: 12px 1fr auto 44px; align-items: center; gap: 10px; font-size: 13.5px; }
.bi-legend i { width: 12px; height: 12px; border-radius: 50%; }
.bi-legend b { font-variant-numeric: tabular-nums; }
.bi-legend em { font-style: normal; color: var(--text-3); text-align: right; font-size: 12.5px; }
/* barras horizontais */
.bi-hbars { display: grid; gap: 12px; }
.bi-hrow { display: grid; grid-template-columns: minmax(100px, 26%) minmax(60px, 1fr) 44px minmax(120px, 190px); align-items: center; gap: 12px; }
.bi-hl { font-size: 13px; color: var(--text); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bi-hl em { font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--warn); background: var(--warn-bg); border-radius: 999px; padding: 1px 6px; margin-left: 6px; }
.bi-htrack { display: flex; gap: 2px; height: 26px; background: #F1F4F8; border-radius: 6px; overflow: hidden; }
.bi-htrack i { display: block; height: 100%; }
.bi-htrack i:last-of-type { border-radius: 0 6px 6px 0; }
.bi-htrack i[style*="width:0%"] { display: none; }
.bi-hp { font-size: 13px; font-weight: 700; color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; }
.bi-hv { display: grid; text-align: right; }
.bi-hv b { font-size: 14px; color: var(--abba-navy-950); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bi-hv small { font-size: 11.5px; color: var(--text-3); line-height: 1.3; }
.bi-hrow.no-pct { grid-template-columns: minmax(100px, 26%) minmax(60px, 1fr) minmax(140px, 220px); }
@media (max-width: 1100px) { .bi-grid { grid-template-columns: 1fr; } .bi-kpis { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .bi-donut { grid-template-columns: 1fr; justify-items: center; } .bi-hrow { grid-template-columns: 1fr 44px 100px; } .bi-hl { grid-column: 1 / -1; text-align: left; } }
/* Fechamento da proposta */
.chip-won { background: var(--ok-bg); color: var(--ok); }
.chip-lost { background: #FDECEC; color: #B42318; }
.chip-open { background: #EEF1F5; color: var(--text-3); }
.outcome { margin: 0 0 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); display: grid; gap: 8px; }
.outcome-ask { border-color: #B8DDF0; background: var(--abba-blue-50); }
.outcome-t { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--abba-navy); }
.outcome-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.outcome-row > .chip { flex: none; }
.outcome-row > span:not(.chip) { flex: 1; min-width: 0; font-size: 13.5px; }
.outcome-row small { display: block; color: var(--text-3); font-size: 12px; }
.outcome-form { display: grid; gap: 8px; }
.btn-won { color: var(--ok); border-color: #A9DDB9; background: #fff; }
.btn-won:hover { background: var(--ok); color: #fff; }
.btn-lost { color: #B42318; border-color: #F3B8B3; background: #fff; }
.btn-lost:hover { background: #B42318; color: #fff; }
.btn-won svg, .btn-lost svg { width: 14px; height: 14px; }
/* Pacote (vários produtos) no simulador */
.pkg-list { display: grid; gap: 6px; margin: 4px 0 2px; }
.pkg-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); }
.pkg-n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--abba-navy); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.pkg-txt { flex: 1; min-width: 0; display: grid; }
.pkg-txt b { font-size: 13.5px; color: var(--abba-navy-950); }
.pkg-txt span { font-size: 12.5px; color: var(--text-3); }
.pkg-del svg { width: 14px; height: 14px; }
.pkg-editing { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--abba-blue-600); margin: 8px 0 2px; }
.pkg-add { display: grid; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.pkg-add .btn { justify-self: start; color: var(--abba-blue-600); border-color: #B8DDF0; background: var(--abba-blue-50); }
.pkg-add .btn svg { width: 14px; height: 14px; }
.pkg-tbl td { vertical-align: middle; font-size: 13px; padding: 8px 12px; }
.pkg-tbl th { padding: 8px 12px; }
.pkg-tbl td small { display: block; color: var(--text-3); font-size: 12px; }
.pkg-tbl td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pkg-tbl td.num s { display: block; color: var(--text-3); font-size: 11.5px; }
.mpill { display: inline-block; min-width: 62px; text-align: center; padding: 2px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
.mpill.ok { background: var(--ok-bg); color: var(--ok); }
.mpill.low { background: var(--warn-bg); color: var(--warn); }
.btn-sim { color: var(--abba-blue-600); border-color: #B8DDF0; background: var(--abba-blue-50); white-space: nowrap; }
.btn-sim:hover { background: var(--abba-blue); color: #fff; border-color: var(--abba-blue); }
.btn-sim svg { width: 14px; height: 14px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.toolbar .input, .toolbar .select { max-width: 320px; }

/* ---------- Simulador ---------- */
.sim { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
.sim-form { display: grid; gap: 16px; }
.step { display: grid; grid-template-columns: 30px 1fr; gap: 14px; }
.step-n { width: 30px; height: 30px; border-radius: 50%; background: var(--abba-navy); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.step.disabled .step-n { background: var(--border-strong); }
.step.disabled .step-body { opacity: .55; pointer-events: none; }
.step-body { display: grid; gap: 10px; min-width: 0; }
.step-title { font-weight: 700; color: var(--abba-navy-950); font-size: 14.5px; padding-top: 4px; }
.sim-summary { position: sticky; top: 84px; display: grid; gap: 16px; }
.price-hero { background: linear-gradient(160deg, var(--abba-navy) 0%, var(--abba-navy-950) 100%); color: #fff; border-radius: var(--radius); padding: 20px; position: relative; overflow: hidden; }
.price-hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%; border: 26px solid rgba(0, 149, 218, .22); }
.price-hero .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #A9BEDC; font-weight: 600; }
.price-hero .big { font-size: 32px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.price-hero .big small { font-size: 14px; font-weight: 500; color: #C9D6EA; }
.price-hero .total { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, .15); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; position: relative; z-index: 1; }
.price-hero .total b { font-size: 24px; color: #fff; font-variant-numeric: tabular-nums; }
.price-hero .list { color: #C9D6EA; font-size: 13px; margin-top: 4px; }
.price-hero .list s { opacity: .8; }
.price-hero.unavailable { background: #5B6B82; }
.price-hero .hero-items-t { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .15); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: #A9BEDC; position: relative; z-index: 1; }
.price-hero .hero-items { display: grid; gap: 2px; margin-top: 6px; position: relative; z-index: 1; }
.price-hero .hero-item { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 6px 0; border-bottom: 1px dashed rgba(255, 255, 255, .14); }
.price-hero .hero-item:last-child { border-bottom: 0; }
.price-hero .hero-item span { font-size: 13.5px; font-weight: 600; color: #fff; min-width: 0; }
.price-hero .hero-item span small { display: block; font-weight: 400; font-size: 12px; color: #C9D6EA; }
.price-hero .hero-item b { font-size: 19px; color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; }
.price-hero .hero-item b small { font-size: 12px; font-weight: 500; color: #C9D6EA; }
.price-hero .list-price { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 10px; padding: 7px 12px; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .18); border-radius: 10px; position: relative; z-index: 1; }
.price-hero .list-price .lp-lbl { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: #DCE6F4; }
.price-hero .list-price s { font-size: 18px; font-weight: 700; color: #fff; text-decoration-thickness: 2px; text-decoration-color: #FF9C9C; font-variant-numeric: tabular-nums; }
.price-hero .list-price .lp-off { font-size: 13px; font-weight: 700; color: #0B3B24; background: #6EE7A8; padding: 2px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.lines { display: grid; }
.line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13.5px; }
.line:last-child { border-bottom: 0; }
.line .v { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.line.neg .v { color: var(--ok); }
.line.total { border-top: 2px solid var(--abba-navy); border-bottom: 0; margin-top: 4px; padding-top: 10px; font-size: 15px; }
.line.total .v { color: var(--abba-navy); font-size: 17px; }
.line .k small { display: block; color: var(--text-3); font-size: 12px; }
.msgs { display: grid; gap: 8px; }
.discount-panel { border: 1px solid var(--abba-blue); background: #F7FBFE; border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.commission-box { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; }
.commission-box b { font-size: 18px; color: var(--abba-navy); font-variant-numeric: tabular-nums; }
.internal { border: 1px solid #D6DEEA; background: var(--surface); }
.internal .card-h { background: var(--navy-50); }
.internal .card-h h2::after { content: " · interno"; font-weight: 600; color: var(--text-3); text-transform: none; letter-spacing: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi { padding: 16px 18px; }
.kpi .k { font-size: 12.5px; color: var(--text-3); font-weight: 600; }
.kpi .v { font-size: 24px; font-weight: 700; color: var(--abba-navy-950); margin-top: 2px; font-variant-numeric: tabular-nums; }

/* Catálogo em cartões (celular) */
.cat-cards { display: none; }
.cat-card { padding: 14px 16px; display: grid; gap: 8px; }
.cat-card .prices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cat-card .prices div { background: var(--surface-2); border-radius: 7px; padding: 8px 10px; }
.cat-card .prices b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(16, 39, 72, .45); display: grid; place-items: center; z-index: 100; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); width: 100%; max-width: 760px; max-height: calc(100vh - 32px); overflow: auto; }
.modal .card-h { position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--surface); }
.dl { display: grid; grid-template-columns: 200px 1fr; gap: 8px 16px; font-size: 13.5px; }
.dl dt { color: var(--text-3); }
.dl dd { margin: 0; font-weight: 500; }
.section-t { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); font-weight: 700; margin: 18px 0 8px; }
/* Detalhe da proposta */
.prop-hero { margin-bottom: 16px; }
.prop-hero-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12.5px; color: #C9D6EA; position: relative; z-index: 1; }
.prop-info { grid-template-columns: 110px 1fr; }
.prop-lines { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px 14px; }
.prop-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.prop-kpi { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; display: grid; gap: 2px; background: var(--bg); }
.prop-kpi span { font-size: 12px; color: var(--text-3); }
.prop-kpi b { font-size: 18px; font-variant-numeric: tabular-nums; color: var(--abba-navy); }
.prop-kpi small { font-size: 12px; color: var(--text-2); }
.prop-more { margin-top: 10px; }
.prop-more summary { cursor: pointer; font-size: 13px; color: var(--abba-blue); margin-bottom: 8px; }
@media (max-width: 640px) { .prop-kpis { grid-template-columns: 1fr; } .prop-info { grid-template-columns: 1fr; } }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tabs a { padding: 10px 14px; text-decoration: none; color: var(--text-2); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a.active { color: var(--abba-navy); border-bottom-color: var(--abba-blue); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--abba-navy-950); color: #fff; padding: 11px 18px; border-radius: 9px; box-shadow: var(--shadow-lg); z-index: 200; max-width: calc(100vw - 32px); }
.toast.err { background: var(--danger); }
.empty { padding: 36px 20px; text-align: center; color: var(--text-3); }
.inline-input { width: 110px; height: 32px; }
.recon { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--text-2); }
.pill-sync { font-size: 12px; color: var(--text-3); display: inline-flex; align-items: center; gap: 6px; }
.pill-sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

/* ---------- Responsivo ---------- */
@media (max-width: 1180px) {
  .sim { grid-template-columns: minmax(0, 1fr) 330px; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 1060px) {
  .sim { grid-template-columns: 1fr; }
  .sim-summary { position: static; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 272px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow-lg); }
  .shell.nav-open .sidebar { transform: none; }
  .shell.nav-open::after { content: ""; position: fixed; inset: 0; background: rgba(16, 39, 72, .4); z-index: 25; }
  .menu-btn { display: inline-flex; }
  .topbar { padding: 10px 16px; gap: 10px; }
  .topbar h1 { font-size: 17px; }
  .topbar .crumb, .user-chip .who { display: none; }
  .viewas-bar { padding: 8px 16px; flex-wrap: wrap; }
  .content { padding: 16px 16px 32px; }
  .footer-note { padding: 12px 16px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .login-wrap { grid-template-columns: 1fr; }
  .login-brand { display: none; }
  .login-card .logo-mobile { display: block; }
  .cat-table { display: none; }
  .cat-cards { display: grid; }
  .dl { grid-template-columns: 1fr; gap: 2px 0; }
  .dl dd { margin-bottom: 8px; }
  .step { grid-template-columns: 26px 1fr; gap: 10px; }
  .step-n { width: 26px; height: 26px; font-size: 12px; }
  .card-b { padding: 16px; }
  .toolbar .input, .toolbar .select { max-width: none; }
  .tbl-mobile-hide { display: none; }
}
@media (max-width: 520px) {
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi .v { font-size: 19px; }
  .price-hero .big { font-size: 28px; }
}

/* Faixa de ambiente (homologação/demonstração) */
.env-band { position: fixed; top: 0; left: 0; right: 0; height: 26px; z-index: 300; background: repeating-linear-gradient(135deg, #FFF4E0 0 14px, #FCE8C3 14px 28px); color: var(--warn); font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #F3D9A8; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 12px; }
body.has-env-band { padding-top: 26px; }
body.has-env-band .sidebar { top: 26px; height: calc(100vh - 26px); }
body.has-env-band .topbar { top: 26px; }
body.has-env-band .login-wrap { min-height: calc(100vh - 26px); }
</style>
</head>
